name: pt2-prepare-windows-fix

on:
  push:
    branches: [ci/pt2-python-paths-20260916]

permissions:
  contents: write

concurrency:
  group: pt2-prepare-windows-fix
  cancel-in-progress: false

jobs:
  prepare-repair:
    if: github.repository == 'mingshi2333/ncnn' && github.ref == 'refs/heads/ci/pt2-python-paths-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Reproduce, repair, regress and publish only the new clean fork branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/prepare_pt2_windows_fix.py
      - name: Preserve exact repair and validation provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pt2-python-path-repair
          path: |
            repair-provenance.json
            repair.patch
            reviewed-source.tar
            regression-before.log
            regression-after.log
          retention-days: 7
