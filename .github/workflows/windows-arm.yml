name: validate-native-arm64-defaults
'on':
  push:
    branches:
    - codex/validate-native-arm64-defaults
permissions:
  contents: read
jobs:
  windows-arm:
    name: vs2026-arm64-native
    runs-on: windows-11-vs2026-arm
    env:
      UseMultiToolTask: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: build
      run: 'mkdir build; cd build

        cmake -G "Visual Studio 18 2026" -A arm64 -T v145 -DNCNN_BUILD_TESTS=ON -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_VULKAN=OFF ..

        cmake --build . --config Release -j 4

        '
    - name: verify default ARM82 coverage
      run: "$cache = Get-Content build/CMakeCache.txt\n$cache | Select-String '^NCNN_(ARM82|ARM82DOT|ARM82FP16FML|BUILD_TESTS|RUNTIME_CPU):BOOL='\nif ($cache -notcontains 'NCNN_ARM82:BOOL=ON') { throw 'The default ARM82 build is not enabled.' }\nAdd-Type @'\nusing System.Runtime.InteropServices;\npublic static class Arm64Features {\n    [DllImport(\"kernel32.dll\")]\n    [return: MarshalAs(UnmanagedType.Bool)]\n    public static extern bool IsProcessorFeaturePresent(uint feature);\n}\n'@\n$dotprod = [Arm64Features]::IsProcessorFeaturePresent(43)\n$fp16 = [Arm64Features]::IsProcessorFeaturePresent(67)\nWrite-Host \"Windows ARM64 features: dotprod=$dotprod fp16=$fp16\"\nif (-not ($dotprod -or $fp16)) { throw 'Windows does not report the FP16 capability used by ncnn runtime dispatch.' }\n"
    - name: test
      run: cd build; ctest -C Release --output-on-failure -j 4
