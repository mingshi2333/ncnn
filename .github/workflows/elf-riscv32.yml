name: elf-riscv32
on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/elf-riscv32.yml'
    - 'toolchains/riscv32-unknown-elf.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/riscv/**'
    - 'tests/**'
  pull_request:
    branches: [master, pnnx-exported-program]
    paths:
    - '.github/scripts/ncnn_fork_ci.py'
    - '.github/workflows/elf-riscv32.yml'
    - 'toolchains/riscv32-unknown-elf.toolchain.cmake'
    - 'CMakeLists.txt'
    - 'cmake/**'
    - 'src/*'
    - 'src/layer/*'
    - 'src/layer/riscv/**'
    - 'tests/**'
concurrency:
  group: elf-riscv32-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  rv32gc:
    if: github.repository == 'mingshi2333/ncnn' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'validation/pt2-f64-onnx-fp16-full-20260916'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:25.04
    steps:
    - name: fork-bootstrap
      run: |
        apt-get update --error-on=any
        apt-get install -y build-essential cmake git ca-certificates curl wget xz-utils unzip python3 python3-venv ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: fork-provision
      run: bash .github/scripts/ncnn_fork_setup.sh elf32

